<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script> 
</head>

<body>

    <div class=" container main-box m-auto text-center  mt-5" style="height: 420px; width:280px">

        <div class=" mt-3" >
            <input type="text" class="screen "  id="show" style="height: 60px; background-color: rgb(228, 214, 214); width:95%">
        </div>

        <div class="mt-3  " >
            <button class="btn rounded-circle  fs-2 text-white" onclick="getnumber('7')" style="background-color: rgb(182, 170, 170);"  >7</button>
            <button class="btn fs-2 text-white  rounded-circle " onclick="getnumber('8')" style="background-color: rgb(182, 170, 170);" > 8 </button>
            <button class="btn fs-2 text-white  rounded-circle " onclick="getnumber('9')" style="background-color: rgb(182, 170, 170);"> 9 </button>
            <button class="btn fs-2 text-white  rounded-circle " onclick="getnumber('*')" style="width: 55px; background-color:rgb(217, 120, 23)">x</button>
        </div>

        <div class=" mt-3"  >
            <button class="btn fs-2 text-white  rounded-circle" onclick="getnumber('4')"style="background-color: rgb(182, 170, 170, 0.4);">4</button>
            <button class="btn fs-2 text-white  rounded-circle" onclick="getnumber('5')" style="background-color: rgb(182, 170, 170, 0.4);">5</button>
            <button class="btn fs-2 text-white  rounded-circle" onclick="getnumber('6')" style="background-color: rgb(182, 170, 170, 0.4);">6</button>
            <button class="btn fs-2 text-white  rounded-circle" onclick="getnumber('+')" style="width: 55px; background-color:rgb(217, 120, 23)">+</button>
        </div>

        <div class="mb-3 mt-3"  >
            <button class="btn fs-2 text-white  rounded-circle" onclick="getnumber('1')" style="background-color: rgb(182, 170, 170, 0.4);"> 1 </button>
            <button class="btn fs-2 text-white  rounded-circle" onclick="getnumber('2')" style="background-color: rgb(182, 170, 170, 0.4);"> 2 </button>
            <button class="btn fs-2 text-white  rounded-circle" onclick="getnumber('3')" style="background-color: rgb(182, 170, 170, 0.4);"> 3 </button>
            <button class="btn fs-2 text-white  rounded-circle" onclick="getnumber('-')" style="width: 55px; background-color:rgb(217, 120, 23)">-</button>
        </div>

        <div class="mt-2  " >
            <button class="btn fs-2 text-white rounded-circle" onclick="getnumber('/')" style="background-color:rgb(182, 170, 170, 0.4);">/</button>
            <button class="btn fs-2 text-white rounded-circle  " onclick="getnumber('0')" style="background-color: rgb(182, 170, 170, 0.4);">0</button>
            <button class="btn fs-2 text-white rounded-circle " onclick="getresult()" style="background-color: rgb(182, 170, 170, 0.4);">=</button>
            <button class="btn fs-2 text-white " onclick=" clearesult()" style="background-color:  rgb(23, 97, 137);"> C </button>
        </div>

    </div>









<script src="app.js"></script>

</body>

</html>
